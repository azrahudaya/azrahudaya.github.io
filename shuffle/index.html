<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Shuffle | ajra.tech</title>
  <meta name="description" content="Kartu remi Uno bertekstur dengan animasi flip di tempat, turun ke bawah, dan muncul close-up dari bawah layar beserta kirim email.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <!-- GSAP for 60fps buttery smooth card physics -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #ffffff;
      color: #0f172a;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      padding: 60px 24px;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    /* Minimalist Floating Controls */
    .controls {
      position: fixed;
      top: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 50;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      padding: 6px 14px;
      border-radius: 9999px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08), 0 2px 6px rgba(0, 0, 0, 0.04);
      border: 1px solid #f1f5f9;
    }

    .btn {
      appearance: none;
      border: none;
      background: transparent;
      color: #334155;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 9px 18px;
      border-radius: 9999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      min-height: 38px;
    }

    .btn:hover:not(:disabled) {
      background: #f8fafc;
      color: #0f172a;
    }

    .btn:focus-visible {
      outline: 2px solid #2563eb;
      outline-offset: 2px;
    }

    .btn-primary {
      background: #0f172a;
      color: #ffffff;
    }

    .btn-primary:hover:not(:disabled) {
      background: #1e293b;
      color: #ffffff;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none !important;
    }

    /* Status indicator */
    .status-badge {
      font-size: 12px;
      font-weight: 600;
      color: #64748b;
      padding: 5px 12px;
      border-radius: 9999px;
      background: #f8fafc;
      border: 1px solid #f1f5f9;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
      transition: background-color 0.3s ease;
    }

    .status-dot.active {
      background: #f59e0b;
      animation: blink 0.6s infinite alternate;
    }

    @keyframes blink {
      from { opacity: 0.3; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1.1); }
    }

    /* Arena & Stage */
    .stage {
      width: 100%;
      max-width: 1480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 30px;
      perspective: 2600px;
    }

    .card-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 36px;
      width: 100%;
      position: relative;
      min-height: 520px;
      padding: 24px 10px;
    }

    /* Ukuran Kartu Remi / Uno Besar: 310px x 465px */
    .card-wrap {
      width: 310px;
      height: 465px;
      position: relative;
      cursor: pointer;
      flex-shrink: 0;
      transform-style: preserve-3d;
      perspective: 1800px;
      will-change: transform, opacity;
    }

    .card-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      border-radius: 26px;
      box-shadow:
        0 20px 45px -12px rgba(0, 0, 0, 0.18),
        0 8px 20px -6px rgba(0, 0, 0, 0.1);
      transition: box-shadow 0.3s ease;
      will-change: transform;
    }

    .card-wrap:hover .card-inner {
      box-shadow:
        0 30px 60px -15px rgba(0, 0, 0, 0.24),
        0 12px 24px -6px rgba(0, 0, 0, 0.12);
    }

    .card-wrap:focus-visible .card-inner {
      box-shadow: 0 0 0 3px #2563eb, 0 25px 50px rgba(0, 0, 0, 0.2);
    }

    /* Card Faces */
    .card-face {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border-radius: 26px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      overflow: hidden;
    }

    /* SISI DEPAN / TERTUTUP: Polos Bertekstur Tajam Khas Kartu Uno */
    .card-face-back {
      background-color: var(--card-color, #e11d48);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        inset 0 2px 4px rgba(255, 255, 255, 0.6),
        inset 0 -3px 6px rgba(0, 0, 0, 0.35);
    }

    /* Tekstur Linen & Air-Cushion Emboss yang Menyala */
    .card-face-back::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle at 50% 15%, rgba(255, 255, 255, 0.28) 0%, transparent 75%),
        radial-gradient(rgba(255, 255, 255, 0.16) 1px, transparent 1px),
        repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.05) 0px, rgba(255, 255, 255, 0.05) 2px, transparent 2px, transparent 5px),
        repeating-linear-gradient(-45deg, rgba(0, 0, 0, 0.04) 0px, rgba(0, 0, 0, 0.04) 2px, transparent 2px, transparent 5px);
      background-size: 100% 100%, 6px 6px, auto, auto;
      pointer-events: none;
      border-radius: 26px;
    }

    /* Inner Border Putih Khas Kartu Uno */
    .card-face-back::before {
      content: '';
      position: absolute;
      inset: 18px;
      border: 4px solid rgba(255, 255, 255, 0.95);
      border-radius: 18px;
      pointer-events: none;
      z-index: 2;
      box-shadow:
        0 2px 6px rgba(0, 0, 0, 0.2),
        inset 0 0 10px rgba(0, 0, 0, 0.08);
    }

    /* SISI BELAKANG / TERBUKA: Super Clean */
    .card-face-front {
      background-color: #ffffff;
      transform: rotateY(180deg);
      border: 2px solid #f1f5f9;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 38px 32px;
      text-align: left;
      box-shadow:
        inset 0 1px 2px rgba(255, 255, 255, 0.9),
        inset 0 -1px 2px rgba(0, 0, 0, 0.04);
    }

    .card-front-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-color-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background-color: var(--card-color, #e11d48);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
    }

    .card-index {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      font-weight: 700;
      color: #94a3b8;
      letter-spacing: 0.04em;
    }

    .card-front-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 24px 0;
    }

    .card-content {
      font-size: 18px;
      font-weight: 600;
      line-height: 1.65;
      color: #0f172a;
      word-break: break-word;
      max-height: 280px;
      overflow-y: auto;
      letter-spacing: -0.01em;
    }

    .card-content::-webkit-scrollbar {
      width: 4px;
    }
    .card-content::-webkit-scrollbar-thumb {
      background: #e2e8f0;
      border-radius: 4px;
    }

    /* CLOSE-UP HERO CARD FOCUS MODAL (Dark + Blur Overlay, Card Pops Up from Bottom 1/3 Sunken) */
    .hero-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 150;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 0;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .hero-modal-backdrop.is-active {
      opacity: 1;
      pointer-events: auto;
    }

    /* Close-up Hero Card: 50% Lebih Besar (720px x 1080px), 1/3 tenggelam di bawah tepi layar */
    .hero-card-container {
      width: 720px;
      height: 1080px;
      max-width: 95vw;
      background: #ffffff;
      border-radius: 20px 20px 0 0;
      box-shadow:
        0 -30px 100px -10px rgba(0, 0, 0, 0.55),
        0 25px 50px rgba(0, 0, 0, 0.25);
      overflow: hidden;
      border: 2px solid #f1f5f9;
      position: relative;
      display: flex;
      flex-direction: column;
      margin-bottom: -360px;
      transform: translateY(120vh);
      will-change: transform, opacity;
    }

    /* Garis aksen merah tipis halus, tidak tebal */
    .hero-card-top-bar {
      height: 3px;
      background-color: var(--hero-color, #2563eb);
      width: 100%;
      flex-shrink: 0;
    }

    .hero-card-content {
      padding: 42px 48px 48px;
      display: flex;
      flex-direction: column;
      height: 700px;
      justify-content: space-between;
    }

    .hero-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .hero-badge-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .hero-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background-color: var(--hero-color, #2563eb);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    .hero-close-btn {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: #f1f5f9;
      border: none;
      color: #64748b;
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .hero-close-btn:hover {
      background: #e2e8f0;
      color: #0f172a;
    }

    .hero-body {
      font-size: 24px;
      font-weight: 600;
      color: #0f172a;
      line-height: 1.65;
      margin: 16px 0 32px;
      max-height: 360px;
      overflow-y: auto;
      letter-spacing: -0.015em;
    }

    /* Email Submission Section */
    .hero-email-box {
      border-top: 1px solid #f1f5f9;
      padding-top: 28px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Tulisan kecil warna merah */
    .hero-email-label {
      font-size: 14px;
      font-weight: 700;
      color: #e11d48;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hero-email-label svg {
      color: #e11d48;
      stroke: #e11d48;
    }

    .hero-input-row {
      display: flex;
      gap: 12px;
      align-items: stretch;
    }

    .hero-input {
      flex: 1;
      height: 52px;
      border: 1.5px solid #cbd5e1;
      border-radius: 12px;
      padding: 0 18px;
      font-family: inherit;
      font-size: 15px;
      color: #0f172a;
      outline: none;
      transition: all 0.2s ease;
      background: #f8fafc;
    }

    .hero-input:focus {
      border-color: #2563eb;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .hero-send-btn {
      height: 52px;
      padding: 0 28px;
      border-radius: 12px;
      background: #0f172a;
      color: #ffffff;
      font-weight: 600;
      font-size: 15px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .hero-send-btn:hover:not(:disabled) {
      background: #1e293b;
      transform: translateY(-1px);
    }

    .hero-send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .hero-msg {
      font-size: 13px;
      line-height: 1.4;
      padding: 12px 16px;
      border-radius: 10px;
      display: none;
    }

    .hero-msg.success {
      display: block;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #166534;
    }

    .hero-msg.error {
      display: block;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
    }

    /* JSON Editor Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(6px);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .modal-backdrop.is-active {
      display: flex;
      opacity: 1;
    }

    .modal-window {
      background: #ffffff;
      width: 100%;
      max-width: 580px;
      border-radius: 20px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.2);
      border: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transform: scale(0.96);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-backdrop.is-active .modal-window {
      transform: scale(1);
    }

    .modal-header {
      padding: 20px 24px;
      border-bottom: 1px solid #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-title {
      font-size: 17px;
      font-weight: 700;
      color: #0f172a;
    }

    .modal-body {
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .modal-desc {
      font-size: 13px;
      color: #64748b;
      line-height: 1.5;
    }

    .json-textarea {
      width: 100%;
      height: 250px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      padding: 14px 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: #0f172a;
      background: #f8fafc;
      resize: vertical;
      outline: none;
      line-height: 1.5;
    }

    .json-textarea:focus {
      border-color: #2563eb;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .error-box {
      display: none;
      padding: 12px 14px;
      border-radius: 10px;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
      font-size: 13px;
    }

    .modal-footer {
      padding: 16px 24px;
      border-top: 1px solid #f1f5f9;
      background: #fafafa;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    @media (max-width: 768px) {
      .controls {
        top: 14px;
        flex-wrap: wrap;
        justify-content: center;
      }
      .card-wrap {
        width: 240px;
        height: 360px;
      }
      .card-face-front {
        padding: 28px 24px;
      }
      .card-title {
        font-size: 20px;
      }
      .card-content {
        font-size: 14px;
      }
      .hero-card-container {
        width: min(440px, 94vw);
        height: 640px;
        margin-bottom: -180px;
      }
      .hero-card-content {
        padding: 24px 22px 28px;
        height: 460px;
      }
      .hero-input-row {
        flex-direction: column;
      }
      .hero-send-btn {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>

  <!-- Floating Controls -->
  <div class="controls">
    <button class="btn btn-primary" id="btnShuffle" type="button">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22"/><path d="m18 2 4 4-4 4"/><path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2"/><path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8"/><path d="m18 14 4 4-4 4"/></svg>
      <span>Kocok Kartu</span>
    </button>
    <button class="btn" id="btnFlipToggle" type="button">Buka Semua</button>
    <button class="btn" id="btnOpenJson" type="button">Edit JSON</button>
    <div class="status-badge">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusLabel">Siap</span>
    </div>
  </div>

  <!-- Stage -->
  <main class="stage">
    <div class="card-row" id="cardRow">
      <!-- 4 Cards rendered permanently -->
    </div>
  </main>

  <!-- CLOSE-UP HERO CARD FOCUS MODAL -->
  <div class="hero-modal-backdrop" id="heroModalBackdrop">
    <div class="hero-card-container" id="heroCardContainer">
      <div class="hero-card-top-bar" id="heroCardTopBar"></div>
      <div class="hero-card-content">
        <div class="hero-header-row">
          <div class="hero-badge-wrap">
            <span class="hero-dot" id="heroDot"></span>
          </div>
          <button class="hero-close-btn" id="btnHeroClose" type="button" aria-label="Tutup">&times;</button>
        </div>

        <p class="hero-body" id="heroBody">Isi deskripsi kartu akan tampil di sini secara lengkap dan mudah dibaca.</p>

        <!-- Form Email -->
        <div class="hero-email-box">
          <label class="hero-email-label" for="heroEmailInput">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
            <span>Tuliskan email kamu:</span>
          </label>
          <div class="hero-input-row">
            <input class="hero-input" id="heroEmailInput" type="email" placeholder="nama@email.com" autocomplete="email" required>
            <button class="hero-send-btn" id="btnHeroSend" type="button">
              <span>Kirim</span>
            </button>
          </div>
          <div class="hero-msg" id="heroMsg"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- JSON Modal -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal-window">
      <div class="modal-header">
        <h2 class="modal-title">Edit Konten Kartu (JSON)</h2>
        <button class="btn" id="btnCloseModal" type="button" style="padding: 4px 10px; font-size: 20px;">&times;</button>
      </div>
      <div class="modal-body">
        <p class="modal-desc">
          Format array JSON. Tiap item memiliki properti: <code>title</code>, <code>content</code>, dan <code>color</code> (kode HEX warna kartu).
        </p>
        <div class="error-box" id="errorBox"></div>
        <textarea class="json-textarea" id="jsonInput" spellcheck="false"></textarea>
      </div>
      <div class="modal-footer">
        <button class="btn" id="btnResetDefault" type="button">Reset Bawaan</button>
        <button class="btn btn-primary" id="btnSaveJson" type="button">Simpan & Terapkan</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      // 4 kartu Uno default dengan warna solid yang cerah dan bertekstur (tanpa judul kartu merah)
      const DEFAULT_CARDS = [
        {
          id: 'card-red',
          title: "",
          content: "Fokus pada hal paling berdampak. Singkirkan hal yang tidak esensial.",
          color: "#e11d48"
        },
        {
          id: 'card-blue',
          title: "",
          content: "Ketenangan dan kejernihan berpikir menghasilkan keputusan yang tepat.",
          color: "#2563eb"
        },
        {
          id: 'card-green',
          title: "",
          content: "Pertumbuhan yang konsisten berawal dari langkah kecil setiap hari.",
          color: "#059669"
        },
        {
          id: 'card-yellow',
          title: "",
          content: "Eksplorasi ide baru dengan rasa ingin tahu dan keberanian mencoba.",
          color: "#d97706"
        }
      ];

      const STORAGE_KEY = 'ajra_cards_data_v7';
      let cards = [];
      let isShuffling = false;
      let activeCardWrap = null;
      let activeCardData = null;

      const cardRow = document.getElementById('cardRow');
      const btnShuffle = document.getElementById('btnShuffle');
      const btnFlipToggle = document.getElementById('btnFlipToggle');
      const btnOpenJson = document.getElementById('btnOpenJson');
      const modalBackdrop = document.getElementById('modalBackdrop');
      const btnCloseModal = document.getElementById('btnCloseModal');
      const btnResetDefault = document.getElementById('btnResetDefault');
      const btnSaveJson = document.getElementById('btnSaveJson');
      const jsonInput = document.getElementById('jsonInput');
      const errorBox = document.getElementById('errorBox');
      const statusDot = document.getElementById('statusDot');
      const statusLabel = document.getElementById('statusLabel');

      // Hero Modal Elements
      const heroModalBackdrop = document.getElementById('heroModalBackdrop');
      const heroCardContainer = document.getElementById('heroCardContainer');
      const heroCardTopBar = document.getElementById('heroCardTopBar');
      const heroDot = document.getElementById('heroDot');
      const heroIndex = document.getElementById('heroIndex');
      const heroTitle = document.getElementById('heroTitle');
      const heroBody = document.getElementById('heroBody');
      const heroEmailInput = document.getElementById('heroEmailInput');
      const btnHeroSend = document.getElementById('btnHeroSend');
      const btnHeroClose = document.getElementById('btnHeroClose');
      const heroMsg = document.getElementById('heroMsg');

      // Web Audio API sintetis untuk efek audio gesekan kartu fisik
      let audioCtx = null;
      function playCardSound(type) {
        try {
          if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          }
          if (audioCtx.state === 'suspended') {
            audioCtx.resume();
          }

          const now = audioCtx.currentTime;

          if (type === 'flip') {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(360, now);
            osc.frequency.exponentialRampToValueAtTime(700, now + 0.08);
            gain.gain.setValueAtTime(0.08, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
            osc.start(now);
            osc.stop(now + 0.09);
          } else if (type === 'cut') {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(180, now);
            osc.frequency.exponentialRampToValueAtTime(320, now + 0.09);
            gain.gain.setValueAtTime(0.07, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
            osc.start(now);
            osc.stop(now + 0.1);
          } else if (type === 'whoosh') {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(140, now);
            osc.frequency.exponentialRampToValueAtTime(450, now + 0.18);
            gain.gain.setValueAtTime(0.09, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
            osc.start(now);
            osc.stop(now + 0.2);
          } else if (type === 'tap') {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(120, now);
            osc.frequency.exponentialRampToValueAtTime(60, now + 0.08);
            gain.gain.setValueAtTime(0.12, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
            osc.start(now);
            osc.stop(now + 0.09);
          } else if (type === 'riffle') {
            for (let i = 0; i < 6; i++) {
              const tick = now + (i * 0.035);
              const osc = audioCtx.createOscillator();
              const gain = audioCtx.createGain();
              osc.connect(gain);
              gain.connect(audioCtx.destination);
              osc.type = 'sine';
              osc.frequency.setValueAtTime(460 + (i * 45), tick);
              gain.gain.setValueAtTime(0.045, tick);
              gain.gain.exponentialRampToValueAtTime(0.001, tick + 0.03);
              osc.start(tick);
              osc.stop(tick + 0.03);
            }
          }
        } catch (e) {
          // Audio opsional
        }
      }

      function loadData() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed) && parsed.length > 0) {
              cards = parsed;
              return;
            }
          }
        } catch (e) {
          console.warn('Gagal membaca storage, menggunakan default.');
        }
        cards = JSON.parse(JSON.stringify(DEFAULT_CARDS));
      }

      function saveData(data) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      }

      // Inisialisasi kartu ke DOM secara permanen (tanpa destroy-recreate saat shuffle)
      function initCards() {
        cardRow.innerHTML = '';

        cards.forEach((item, index) => {
          const cardWrap = document.createElement('div');
          cardWrap.className = 'card-wrap';
          cardWrap.id = `card-wrap-${index}`;
          cardWrap.dataset.index = index.toString();
          cardWrap.dataset.flipped = 'false';
          cardWrap.tabIndex = 0;
          cardWrap.setAttribute('role', 'button');

          cardWrap.innerHTML = `
            <div class="card-inner">
              <div class="card-face card-face-back"></div>
              <div class="card-face card-face-front">
                <div class="card-front-top">
                  <div class="card-color-dot"></div>
                  <span class="card-index"></span>
                </div>
                <div class="card-front-body">
                  <p class="card-content"></p>
                </div>
              </div>
            </div>
          `;

          // Alur Klik: Flip di tempat -> Meluncur turun ke bawah -> Muncul close-up dari bawah layar
          cardWrap.addEventListener('click', () => {
            if (isShuffling) return;
            handleCardClickFlow(cardWrap);
          });

          cardWrap.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              if (isShuffling) return;
              handleCardClickFlow(cardWrap);
            }
          });

          // 3D Hover Tilt
          cardWrap.addEventListener('mousemove', (e) => {
            if (isShuffling) return;
            const rect = cardWrap.getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width / 2;
            const y = e.clientY - rect.top - rect.height / 2;
            const rotY = (x / (rect.width / 2)) * 8;
            const rotX = -(y / (rect.height / 2)) * 8;

            gsap.to(cardWrap, {
              rotateX: rotX,
              rotateY: rotY,
              y: -8,
              duration: 0.3,
              ease: "power2.out"
            });
          });

          cardWrap.addEventListener('mouseleave', () => {
            if (isShuffling) return;
            gsap.to(cardWrap, {
              rotateX: 0,
              rotateY: 0,
              y: 0,
              duration: 0.5,
              ease: "power2.out"
            });
          });

          cardRow.appendChild(cardWrap);
        });

        updateCardsDOM();
      }

      // Perbarui teks dan warna pada kartu DOM tanpa merusak elemen
      function updateCardsDOM() {
        const wraps = Array.from(cardRow.querySelectorAll('.card-wrap'));
        cards.forEach((item, index) => {
          const wrap = wraps[index];
          if (!wrap) return;

          wrap.style.setProperty('--card-color', item.color || '#e11d48');
          wrap.setAttribute('aria-label', `Kartu nomor ${index + 1}`);

          const numStr = String(index + 1).padStart(2, '0');
          const indexEl = wrap.querySelector('.card-index');
          const contentEl = wrap.querySelector('.card-content');
          const dotEl = wrap.querySelector('.card-color-dot');

          if (indexEl) indexEl.textContent = numStr;
          if (contentEl) contentEl.textContent = item.content || '';
          if (dotEl) dotEl.style.backgroundColor = item.color || '#e11d48';
        });

        syncToggleButtonText();
      }

      // KOREOGRAFI UTAMA:
      // 1. Flip di tempat
      // 2. Turun ke bawah meja
      // 3. Muncul close-up dari bawah layar dengan latar belakang gelap & blur
      function handleCardClickFlow(cardWrap) {
        if (activeCardWrap) return; // Sedang ada kartu aktif

        const currentIdx = parseInt(cardWrap.dataset.index, 10);
        const cardData = cards[currentIdx];
        if (!cardData) return;

        activeCardWrap = cardWrap;
        activeCardData = { ...cardData, index: currentIdx };
        const cardInner = cardWrap.querySelector('.card-inner');

        // TAHAP 1: Flip 3D 180 derajat di tempat
        playCardSound('flip');
        gsap.to(cardInner, {
          rotateY: 180,
          duration: 0.45,
          ease: "back.out(1.2)",
          onComplete: () => {
            cardWrap.dataset.flipped = 'true';
            syncToggleButtonText();

            // TAHAP 2: Kartu meluncur turun ke bawah layar (dip down)
            playCardSound('cut');
            gsap.to(cardWrap, {
              y: 350,
              opacity: 0,
              scale: 0.9,
              rotateX: -15,
              duration: 0.38,
              ease: "power2.in",
              onComplete: () => {
                // TAHAP 3: Muncul Close-up dari Bawah ke Tengah Layar
                openHeroCloseUp(cardData, currentIdx);
              }
            });
          }
        });
      }

      // BUKA HERO CLOSE-UP DARI BAWAH LAYAR (1/3 Tenggelam di bawah tepi layar)
      function openHeroCloseUp(cardData, index) {
        heroCardTopBar.style.backgroundColor = cardData.color || '#2563eb';
        heroDot.style.backgroundColor = cardData.color || '#2563eb';
        heroBody.textContent = cardData.content || '';
        heroEmailInput.value = '';
        heroMsg.className = 'hero-msg';
        heroMsg.textContent = '';
        heroMsg.style.display = 'none';
        btnHeroSend.disabled = false;
        btnHeroSend.textContent = 'Kirim';

        // Latar gelap & blur muncul
        heroModalBackdrop.classList.add('is-active');
        playCardSound('whoosh');

        // Kartu melesat naik dari bawah layar dengan ukuran besar & tenggelam 1/3
        gsap.fromTo(heroCardContainer,
          {
            y: 850,
            opacity: 0
          },
          {
            y: 0,
            opacity: 1,
            duration: 0.55,
            ease: "power3.out",
            onComplete: () => {
              heroEmailInput.focus();
            }
          }
        );
      }

      // TUTUP HERO CLOSE-UP & KEMBALIKAN KARTU KE MEJA
      function closeHeroCloseUp() {
        playCardSound('cut');
        gsap.to(heroCardContainer, {
          y: 850,
          opacity: 0,
          duration: 0.35,
          ease: "power2.in",
          onComplete: () => {
            heroModalBackdrop.classList.remove('is-active');

            // Kembalikan kartu di meja ke posisinya semula
            if (activeCardWrap) {
              gsap.to(activeCardWrap, {
                y: 0,
                opacity: 1,
                scale: 1,
                rotateX: 0,
                rotateY: 0,
                duration: 0.45,
                ease: "back.out(1.15)",
                onComplete: () => {
                  activeCardWrap = null;
                  activeCardData = null;
                }
              });
            }
          }
        });
      }

      // Kirim Email via Local API / SMTP Gmail
      async function handleSendEmail() {
        const email = heroEmailInput.value.trim();
        if (!email || !email.includes('@')) {
          heroMsg.className = 'hero-msg error';
          heroMsg.textContent = 'Mohon masukkan alamat email yang valid.';
          heroMsg.style.display = 'block';
          return;
        }

        btnHeroSend.disabled = true;
        btnHeroSend.textContent = 'Mengirim...';
        heroMsg.style.display = 'none';

        try {
          const res = await fetch('/api/send-email', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              email: email,
              cardTitle: activeCardData.title,
              cardContent: activeCardData.content,
              cardColor: activeCardData.color
            })
          });

          const json = await res.json();
          if (res.ok && json.ok) {
            heroMsg.className = 'hero-msg success';
            heroMsg.textContent = `Email tes berhasil dikirim ke ${email}! Cek inbox kamu.`;
            heroMsg.style.display = 'block';
            btnHeroSend.textContent = 'Terkirim';
          } else {
            throw new Error(json.error || 'Gagal mengirim email');
          }
        } catch (err) {
          heroMsg.className = 'hero-msg error';
          heroMsg.textContent = 'Error: ' + err.message;
          heroMsg.style.display = 'block';
          btnHeroSend.disabled = false;
          btnHeroSend.textContent = 'Coba Lagi';
        }
      }

      function syncToggleButtonText() {
        const wraps = Array.from(cardRow.querySelectorAll('.card-wrap'));
        if (wraps.length === 0) return;
        const flipped = wraps.filter(w => w.dataset.flipped === 'true').length;
        btnFlipToggle.textContent = (flipped === wraps.length) ? 'Tutup Semua' : 'Buka Semua';
      }

      function toggleAllCards() {
        if (isShuffling || activeCardWrap) return;
        const wraps = Array.from(cardRow.querySelectorAll('.card-wrap'));
        if (wraps.length === 0) return;

        const flippedCount = wraps.filter(w => w.dataset.flipped === 'true').length;
        const willOpen = (flippedCount < wraps.length);
        const targetRotY = willOpen ? 180 : 0;

        wraps.forEach((wrap, idx) => {
          const cardInner = wrap.querySelector('.card-inner');
          gsap.to(cardInner, {
            rotateY: targetRotY,
            duration: 0.6,
            delay: idx * 0.08,
            ease: "back.out(1.15)",
            onStart: () => playCardSound('flip'),
            onComplete: () => {
              wrap.dataset.flipped = willOpen.toString();
              syncToggleButtonText();
            }
          });
        });
      }

      // Algoritma Pengacakan Benar-benar Acak (True Random Derangement)
      function trulyRandomShuffle(arr) {
        if (arr.length <= 1) return arr;
        const originalKeys = arr.map(c => c.color + (c.id || c.title));
        let result = [...arr];

        let changed = false;
        let attempts = 0;

        while (attempts < 20 && !changed) {
          attempts++;
          for (let i = result.length - 1; i > 0; i--) {
            const randArray = new Uint32Array(1);
            window.crypto.getRandomValues(randArray);
            const j = randArray[0] % (i + 1);
            [result[i], result[j]] = [result[j], result[i]];
          }

          let matchCount = 0;
          for (let k = 0; k < result.length; k++) {
            if (result[k].color + (result[k].id || result[k].title) === originalKeys[k]) {
              matchCount++;
            }
          }
          if (matchCount < result.length) {
            changed = true;
          }
        }

        return result;
      }

      // ANIMASI SHUFFLE SEAMLESS TANPA TERPUTUS (Zero DOM Re-creation)
      function shuffle() {
        if (isShuffling || activeCardWrap) return;
        const wraps = Array.from(cardRow.querySelectorAll('.card-wrap'));
        if (wraps.length <= 1) return;

        isShuffling = true;
        btnShuffle.disabled = true;
        btnFlipToggle.disabled = true;
        statusDot.classList.add('active');
        statusLabel.textContent = 'Mengocok...';

        const rowRect = cardRow.getBoundingClientRect();
        const midX = rowRect.width / 2;
        const midY = rowRect.height / 2;

        const tl = gsap.timeline({
          onComplete: () => {
            isShuffling = false;
            btnShuffle.disabled = false;
            btnFlipToggle.disabled = false;
            statusDot.classList.remove('active');
            statusLabel.textContent = 'Terkocok!';
            setTimeout(() => {
              if (!isShuffling) statusLabel.textContent = 'Siap';
            }, 1400);
          }
        });

        // 1. Tutup Kartu yang Terbuka
        wraps.forEach((wrap) => {
          const cardInner = wrap.querySelector('.card-inner');
          if (wrap.dataset.flipped === 'true') {
            tl.to(cardInner, {
              rotateY: 0,
              duration: 0.32,
              ease: "power2.inOut"
            }, 0);
            wrap.dataset.flipped = 'false';
          }
        });
        syncToggleButtonText();

        // 2. Kumpul ke Tengah Jadi Tumpukan Tebal
        wraps.forEach((wrap, i) => {
          const rect = wrap.getBoundingClientRect();
          const curX = rect.left - rowRect.left + rect.width / 2;
          const curY = rect.top - rowRect.top + rect.height / 2;
          const dx = midX - curX;
          const dy = midY - curY - (i * 3);

          tl.to(wrap, {
            x: dx,
            y: dy,
            rotateX: 12,
            rotateY: 0,
            rotationZ: 0,
            scale: 0.98,
            duration: 0.45,
            ease: "power3.inOut"
          }, 0.25);
        });
        tl.call(() => playCardSound('cut'), null, 0.35);

        // 3. Tepuk Meja (Table Tap & Bounce)
        tl.to(wraps, {
          y: "+=12",
          scaleY: 0.95,
          duration: 0.12,
          ease: "power1.in"
        }, 0.72);
        tl.call(() => playCardSound('tap'), null, 0.84);
        tl.to(wraps, {
          y: "-=12",
          scaleY: 1,
          duration: 0.16,
          ease: "back.out(2)"
        }, 0.84);

        // 4. Triple Cut Split
        wraps.forEach((wrap, i) => {
          let sideX = 0;
          let rotZ = 0;
          if (i === 0) {
            sideX = -170;
            rotZ = -12;
          } else if (i === wraps.length - 1) {
            sideX = 170;
            rotZ = 12;
          } else {
            sideX = (i % 2 === 0 ? -60 : 60);
            rotZ = (i % 2 === 0 ? -4 : 4);
          }

          tl.to(wrap, {
            x: `+=${sideX}`,
            y: "-=25",
            rotationZ: rotZ,
            duration: 0.38,
            ease: "power2.out"
          }, 1.05);
        });
        tl.call(() => playCardSound('cut'), null, 1.05);

        // 5. Riffle Weave
        tl.call(() => playCardSound('riffle'), null, 1.45);
        wraps.forEach((wrap, i) => {
          const isEven = i % 2 === 0;
          tl.to(wrap, {
            x: isEven ? "-=40" : "+=40",
            y: `+=${18 + (i * 4)}`,
            rotationZ: isEven ? 5 : -5,
            duration: 0.32,
            ease: "sine.inOut"
          }, 1.45 + (i * 0.05));
        });

        // 6. Waterfall Bridge Cascade
        wraps.forEach((wrap, i) => {
          tl.to(wrap, {
            x: (i % 2 === 0 ? "+=70" : "-=70"),
            y: "-=20",
            rotationZ: (i % 2 === 0 ? -8 : 8),
            duration: 0.3,
            ease: "power2.inOut"
          }, 1.85 + (i * 0.04));
        });
        tl.call(() => playCardSound('riffle'), null, 1.95);

        // 7. Cut Swap
        wraps.forEach((wrap, i) => {
          tl.to(wrap, {
            x: (i % 2 === 0 ? "-=30" : "+=30"),
            y: "+=15",
            rotationZ: (i % 2 === 0 ? 3 : -3),
            duration: 0.28,
            ease: "power1.inOut"
          }, 2.25);
        });
        tl.call(() => playCardSound('cut'), null, 2.25);

        // 8. Square Up ke Titik Tengah
        wraps.forEach((wrap, i) => {
          const rect = wrap.getBoundingClientRect();
          const curX = rect.left - rowRect.left + rect.width / 2;
          const curY = rect.top - rowRect.top + rect.height / 2;
          const dx = midX - curX;
          const dy = midY - curY;

          tl.to(wrap, {
            x: dx,
            y: dy,
            rotateX: 0,
            rotationZ: 0,
            scale: 1,
            duration: 0.32,
            ease: "power3.out"
          }, 2.58);
        });
        tl.call(() => playCardSound('tap'), null, 2.85);

        // 9. Update Data Diam-diam di Balik Layar Saat Masih Bertumpuk di Tengah
        tl.call(() => {
          cards = trulyRandomShuffle(cards);
          updateCardsDOM();
        }, null, 2.92);

        // 10. Seamless Deal Out Meluncur ke Meja Tanpa Putus (Smooth Stagger to x:0, y:0)
        wraps.forEach((wrap, idx) => {
          tl.to(wrap, {
            x: 0,
            y: 0,
            scale: 1,
            rotateX: 0,
            rotateY: 0,
            rotationZ: 0,
            duration: 0.55,
            ease: "back.out(1.2)",
            onStart: () => playCardSound('cut')
          }, 2.98 + (idx * 0.08));
        });
      }

      function openModal() {
        jsonInput.value = JSON.stringify(cards, null, 2);
        errorBox.style.display = 'none';
        modalBackdrop.classList.add('is-active');
        setTimeout(() => jsonInput.focus(), 100);
      }

      function closeModal() {
        modalBackdrop.classList.remove('is-active');
      }

      function saveJson() {
        try {
          const val = jsonInput.value.trim();
          const parsed = JSON.parse(val);
          if (!Array.isArray(parsed) || parsed.length === 0) {
            throw new Error('JSON harus berupa array dan berisi minimal 1 kartu.');
          }

          cards = parsed.map((item, idx) => ({
            id: item.id || `card-${idx + 1}`,
            title: item.title || `Kartu ${idx + 1}`,
            content: item.content || '',
            color: item.color || ['#e11d48', '#2563eb', '#059669', '#d97706'][idx % 4]
          }));

          saveData(cards);
          initCards();
          closeModal();
        } catch (err) {
          errorBox.style.display = 'block';
          errorBox.textContent = 'Format JSON salah: ' + err.message;
        }
      }

      function resetDefault() {
        jsonInput.value = JSON.stringify(DEFAULT_CARDS, null, 2);
        errorBox.style.display = 'none';
      }

      // Event Listeners
      btnShuffle.addEventListener('click', shuffle);
      btnFlipToggle.addEventListener('click', toggleAllCards);
      btnOpenJson.addEventListener('click', openModal);
      btnCloseModal.addEventListener('click', closeModal);
      btnResetDefault.addEventListener('click', resetDefault);
      btnSaveJson.addEventListener('click', saveJson);

      btnHeroClose.addEventListener('click', closeHeroCloseUp);
      btnHeroSend.addEventListener('click', handleSendEmail);
      heroEmailInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          handleSendEmail();
        }
      });

      heroModalBackdrop.addEventListener('click', (e) => {
        if (e.target === heroModalBackdrop) closeHeroCloseUp();
      });

      modalBackdrop.addEventListener('click', (e) => {
        if (e.target === modalBackdrop) closeModal();
      });

      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          if (heroModalBackdrop.classList.contains('is-active')) {
            closeHeroCloseUp();
          } else if (modalBackdrop.classList.contains('is-active')) {
            closeModal();
          }
        } else if (e.key.toLowerCase() === 's' && !modalBackdrop.classList.contains('is-active') && !heroModalBackdrop.classList.contains('is-active') && !['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
          e.preventDefault();
          shuffle();
        }
      });

      // Inisialisasi awal
      loadData();
      initCards();
    })();
  </script>
</body>
</html>
