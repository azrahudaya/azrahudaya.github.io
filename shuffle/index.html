<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Shuffle | ajra.tech</title>
  <meta name="description" content="Kartu remi Uno bertekstur interaktif dengan animasi mengocok fisik GSAP dan kustomisasi JSON.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <!-- GSAP for smooth 60fps card physics animation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #ffffff;
      color: #0f172a;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      padding: 48px 24px;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    /* Minimalist Floating Controls */
    .controls {
      position: fixed;
      top: 28px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 100;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 6px 12px;
      border-radius: 9999px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.07), 0 2px 6px rgba(0, 0, 0, 0.04);
      border: 1px solid #f1f5f9;
    }

    .btn {
      appearance: none;
      border: none;
      background: transparent;
      color: #334155;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 9px 18px;
      border-radius: 9999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      min-height: 38px;
    }

    .btn:hover:not(:disabled) {
      background: #f8fafc;
      color: #0f172a;
    }

    .btn:focus-visible {
      outline: 2px solid #2563eb;
      outline-offset: 2px;
    }

    .btn-primary {
      background: #0f172a;
      color: #ffffff;
    }

    .btn-primary:hover:not(:disabled) {
      background: #1e293b;
      color: #ffffff;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none !important;
    }

    /* Status indicator */
    .status-badge {
      font-size: 12px;
      font-weight: 600;
      color: #64748b;
      padding: 5px 12px;
      border-radius: 9999px;
      background: #f8fafc;
      border: 1px solid #f1f5f9;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
      transition: background-color 0.3s ease;
    }

    .status-dot.active {
      background: #f59e0b;
      animation: blink 0.6s infinite alternate;
    }

    @keyframes blink {
      from { opacity: 0.3; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1.1); }
    }

    /* Arena & Stage */
    .stage {
      width: 100%;
      max-width: 1360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 40px;
      perspective: 2000px;
    }

    .card-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 36px;
      width: 100%;
      position: relative;
      min-height: 480px;
      padding: 20px 10px;
    }

    /* Ukuran Kartu Remi / Uno Besar & Proporsional: 270px x 405px (Rasio 1:1.5) */
    .card-wrap {
      width: 270px;
      height: 405px;
      position: relative;
      cursor: pointer;
      flex-shrink: 0;
      transform-style: preserve-3d;
      perspective: 1600px;
      will-change: transform;
    }

    .card-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      border-radius: 24px;
      box-shadow: 0 16px 36px -10px rgba(0, 0, 0, 0.15), 0 6px 14px -4px rgba(0, 0, 0, 0.08);
      transition: box-shadow 0.3s ease;
      will-change: transform;
    }

    .card-wrap:hover .card-inner {
      box-shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.2), 0 8px 18px -4px rgba(0, 0, 0, 0.1);
    }

    .card-wrap:focus-visible .card-inner {
      box-shadow: 0 0 0 3px #2563eb, 0 20px 40px rgba(0, 0, 0, 0.18);
    }

    /* Card Faces */
    .card-face {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border-radius: 24px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      overflow: hidden;
    }

    /* SISI DEPAN / TERTUTUP: Polos Bertekstur Kartu Uno */
    .card-face-back {
      background-color: var(--card-color, #e11d48);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      /* Embossed linen & card stock bevel */
      box-shadow:
        inset 0 1px 3px rgba(255, 255, 255, 0.45),
        inset 0 -2px 4px rgba(0, 0, 0, 0.25);
    }

    /* Real Paper / Linen Texture Overlay */
    .card-face-back::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.18), transparent 70%),
        repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.03) 0px, rgba(255, 255, 255, 0.03) 2px, transparent 2px, transparent 4px),
        repeating-linear-gradient(-45deg, rgba(0, 0, 0, 0.02) 0px, rgba(0, 0, 0, 0.02) 2px, transparent 2px, transparent 4px);
      pointer-events: none;
      border-radius: 24px;
    }

    /* Inner Border Khas Kartu Uno */
    .card-face-back::before {
      content: '';
      position: absolute;
      inset: 15px;
      border: 3.5px solid rgba(255, 255, 255, 0.9);
      border-radius: 15px;
      pointer-events: none;
      z-index: 2;
      box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.06);
    }

    /* SISI BELAKANG / TERBUKA: Clean Editorial Minimalist */
    .card-face-front {
      background-color: #ffffff;
      transform: rotateY(180deg);
      border: 1.5px solid #f1f5f9;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 32px 28px;
      text-align: left;
      box-shadow:
        inset 0 1px 2px rgba(255, 255, 255, 0.8),
        inset 0 -1px 2px rgba(0, 0, 0, 0.05);
    }

    .card-front-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-color-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #64748b;
    }

    .card-color-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background-color: var(--card-color, #e11d48);
    }

    .card-index {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 600;
      color: #94a3b8;
    }

    .card-front-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 20px 0;
    }

    .card-title {
      font-size: 21px;
      font-weight: 700;
      color: #0f172a;
      line-height: 1.35;
      margin-bottom: 14px;
      word-break: break-word;
      letter-spacing: -0.015em;
    }

    .card-content {
      font-size: 15px;
      font-weight: 500;
      line-height: 1.65;
      color: #475569;
      word-break: break-word;
      max-height: 200px;
      overflow-y: auto;
    }

    .card-content::-webkit-scrollbar {
      width: 4px;
    }
    .card-content::-webkit-scrollbar-thumb {
      background: #e2e8f0;
      border-radius: 4px;
    }

    .card-front-footer {
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      border-top: 1px solid #f1f5f9;
      padding-top: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Simple JSON Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(6px);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .modal-backdrop.is-active {
      display: flex;
      opacity: 1;
    }

    .modal-window {
      background: #ffffff;
      width: 100%;
      max-width: 580px;
      border-radius: 20px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.2);
      border: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transform: scale(0.96);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-backdrop.is-active .modal-window {
      transform: scale(1);
    }

    .modal-header {
      padding: 20px 24px;
      border-bottom: 1px solid #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-title {
      font-size: 17px;
      font-weight: 700;
      color: #0f172a;
    }

    .modal-body {
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .modal-desc {
      font-size: 13px;
      color: #64748b;
      line-height: 1.5;
    }

    .json-textarea {
      width: 100%;
      height: 250px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      padding: 14px 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: #0f172a;
      background: #f8fafc;
      resize: vertical;
      outline: none;
      line-height: 1.5;
    }

    .json-textarea:focus {
      border-color: #2563eb;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .error-box {
      display: none;
      padding: 12px 14px;
      border-radius: 10px;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
      font-size: 13px;
    }

    .modal-footer {
      padding: 16px 24px;
      border-top: 1px solid #f1f5f9;
      background: #fafafa;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    @media (max-width: 768px) {
      .controls {
        top: 14px;
        flex-wrap: wrap;
        justify-content: center;
      }
      .card-wrap {
        width: 220px;
        height: 330px;
      }
      .card-face-front {
        padding: 24px 20px;
      }
      .card-title {
        font-size: 18px;
      }
      .card-content {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>

  <!-- Floating Controls -->
  <div class="controls">
    <button class="btn btn-primary" id="btnShuffle" type="button">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22"/><path d="m18 2 4 4-4 4"/><path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2"/><path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8"/><path d="m18 14 4 4-4 4"/></svg>
      <span>Kocok Kartu</span>
    </button>
    <button class="btn" id="btnFlipToggle" type="button">Buka Semua</button>
    <button class="btn" id="btnOpenJson" type="button">Edit JSON</button>
    <div class="status-badge">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusLabel">Siap</span>
    </div>
  </div>

  <!-- Stage -->
  <main class="stage">
    <div class="card-row" id="cardRow">
      <!-- Cards rendered here -->
    </div>
  </main>

  <!-- JSON Modal -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal-window">
      <div class="modal-header">
        <h2 class="modal-title">Edit Konten Kartu (JSON)</h2>
        <button class="btn" id="btnCloseModal" type="button" style="padding: 4px 10px; font-size: 20px;">&times;</button>
      </div>
      <div class="modal-body">
        <p class="modal-desc">
          Format array JSON. Tiap item memiliki properti: <code>title</code>, <code>content</code>, dan <code>color</code> (kode HEX warna kartu).
        </p>
        <div class="error-box" id="errorBox"></div>
        <textarea class="json-textarea" id="jsonInput" spellcheck="false"></textarea>
      </div>
      <div class="modal-footer">
        <button class="btn" id="btnResetDefault" type="button">Reset Bawaan</button>
        <button class="btn btn-primary" id="btnSaveJson" type="button">Simpan & Terapkan</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      // 4 kartu Uno default dengan warna solid bertekstur
      const DEFAULT_CARDS = [
        {
          id: 'card-red',
          title: "Kartu Merah",
          content: "Fokus pada hal paling berdampak. Singkirkan hal yang tidak esensial.",
          color: "#e11d48"
        },
        {
          id: 'card-blue',
          title: "Kartu Biru",
          content: "Ketenangan dan kejernihan berpikir menghasilkan keputusan yang tepat.",
          color: "#2563eb"
        },
        {
          id: 'card-green',
          title: "Kartu Hijau",
          content: "Pertumbuhan yang konsisten berawal dari langkah kecil setiap hari.",
          color: "#059669"
        },
        {
          id: 'card-yellow',
          title: "Kartu Kuning",
          content: "Eksplorasi ide baru dengan rasa ingin tahu dan keberanian mencoba.",
          color: "#d97706"
        }
      ];

      const STORAGE_KEY = 'ajra_cards_data_v3';
      let cards = [];
      let isShuffling = false;

      const cardRow = document.getElementById('cardRow');
      const btnShuffle = document.getElementById('btnShuffle');
      const btnFlipToggle = document.getElementById('btnFlipToggle');
      const btnOpenJson = document.getElementById('btnOpenJson');
      const modalBackdrop = document.getElementById('modalBackdrop');
      const btnCloseModal = document.getElementById('btnCloseModal');
      const btnResetDefault = document.getElementById('btnResetDefault');
      const btnSaveJson = document.getElementById('btnSaveJson');
      const jsonInput = document.getElementById('jsonInput');
      const errorBox = document.getElementById('errorBox');
      const statusDot = document.getElementById('statusDot');
      const statusLabel = document.getElementById('statusLabel');

      // Web Audio API sintetis untuk efek audio kartu fisik
      let audioCtx = null;
      function playCardSound(type) {
        try {
          if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          }
          if (audioCtx.state === 'suspended') {
            audioCtx.resume();
          }

          const now = audioCtx.currentTime;

          if (type === 'flip') {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(360, now);
            osc.frequency.exponentialRampToValueAtTime(700, now + 0.08);
            gain.gain.setValueAtTime(0.08, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
            osc.start(now);
            osc.stop(now + 0.09);
          } else if (type === 'cut') {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(200, now);
            osc.frequency.exponentialRampToValueAtTime(340, now + 0.08);
            gain.gain.setValueAtTime(0.06, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
            osc.start(now);
            osc.stop(now + 0.09);
          } else if (type === 'riffle') {
            for (let i = 0; i < 5; i++) {
              const tick = now + (i * 0.03);
              const osc = audioCtx.createOscillator();
              const gain = audioCtx.createGain();
              osc.connect(gain);
              gain.connect(audioCtx.destination);
              osc.type = 'sine';
              osc.frequency.setValueAtTime(450 + (i * 40), tick);
              gain.gain.setValueAtTime(0.04, tick);
              gain.gain.exponentialRampToValueAtTime(0.001, tick + 0.025);
              osc.start(tick);
              osc.stop(tick + 0.025);
            }
          }
        } catch (e) {
          // Audio opsional
        }
      }

      function loadData() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed) && parsed.length > 0) {
              cards = parsed;
              return;
            }
          }
        } catch (e) {
          console.warn('Gagal membaca storage, menggunakan default.');
        }
        cards = JSON.parse(JSON.stringify(DEFAULT_CARDS));
      }

      function saveData(data) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      }

      function renderCards() {
        cardRow.innerHTML = '';

        cards.forEach((item, index) => {
          const cardWrap = document.createElement('div');
          cardWrap.className = 'card-wrap';
          cardWrap.id = `card-wrap-${index}`;
          cardWrap.tabIndex = 0;
          cardWrap.style.setProperty('--card-color', item.color || '#e11d48');
          cardWrap.setAttribute('role', 'button');
          cardWrap.setAttribute('aria-label', `Kartu nomor ${index + 1}: ${item.title}`);

          const num = String(index + 1).padStart(2, '0');

          cardWrap.innerHTML = `
            <div class="card-inner">
              <!-- SISI DEPAN / TERTUTUP (Polos bertekstur kartu Uno) -->
              <div class="card-face card-face-back"></div>

              <!-- SISI BELAKANG / TERBUKA (Isi clean editorial) -->
              <div class="card-face card-face-front">
                <div class="card-front-top">
                  <div class="card-color-pill">
                    <span class="card-color-dot"></span>
                    <span>Kartu</span>
                  </div>
                  <span class="card-index">#${num}</span>
                </div>
                <div class="card-front-body">
                  <h3 class="card-title">${escapeHtml(item.title || '')}</h3>
                  <p class="card-content">${escapeHtml(item.content || '')}</p>
                </div>
                <div class="card-front-footer">
                  <span>ajra.tech</span>
                  <span>Flip</span>
                </div>
              </div>
            </div>
          `;

          const cardInner = cardWrap.querySelector('.card-inner');

          // Smooth 3D Flip on Click
          cardWrap.addEventListener('click', () => {
            if (isShuffling) return;
            toggleFlipCard(cardWrap, cardInner);
          });

          // Smooth 3D Flip on Keyboard Enter/Space
          cardWrap.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              if (isShuffling) return;
              toggleFlipCard(cardWrap, cardInner);
            }
          });

          // Subtle Organic 3D Hover Tilt
          cardWrap.addEventListener('mousemove', (e) => {
            if (isShuffling) return;
            const rect = cardWrap.getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width / 2;
            const y = e.clientY - rect.top - rect.height / 2;
            const rotY = (x / (rect.width / 2)) * 8;
            const rotX = -(y / (rect.height / 2)) * 8;

            gsap.to(cardWrap, {
              rotateX: rotX,
              rotateY: rotY,
              y: -8,
              duration: 0.3,
              ease: "power2.out"
            });
          });

          cardWrap.addEventListener('mouseleave', () => {
            if (isShuffling) return;
            gsap.to(cardWrap, {
              rotateX: 0,
              rotateY: 0,
              y: 0,
              duration: 0.5,
              ease: "power2.out"
            });
          });

          cardRow.appendChild(cardWrap);
        });

        syncToggleButtonText();
      }

      function toggleFlipCard(cardWrap, cardInner) {
        const isFlipped = cardWrap.dataset.flipped === 'true';
        const targetRotY = isFlipped ? 0 : 180;

        playCardSound('flip');
        gsap.to(cardInner, {
          rotateY: targetRotY,
          duration: 0.65,
          ease: "back.out(1.2)",
          onComplete: () => {
            cardWrap.dataset.flipped = (!isFlipped).toString();
            syncToggleButtonText();
          }
        });
      }

      function syncToggleButtonText() {
        const wraps = Array.from(cardRow.querySelectorAll('.card-wrap'));
        if (wraps.length === 0) return;
        const flipped = wraps.filter(w => w.dataset.flipped === 'true').length;
        btnFlipToggle.textContent = (flipped === wraps.length) ? 'Tutup Semua' : 'Buka Semua';
      }

      function toggleAllCards() {
        if (isShuffling) return;
        const wraps = Array.from(cardRow.querySelectorAll('.card-wrap'));
        if (wraps.length === 0) return;

        const flippedCount = wraps.filter(w => w.dataset.flipped === 'true').length;
        const willOpen = (flippedCount < wraps.length);
        const targetRotY = willOpen ? 180 : 0;

        wraps.forEach((wrap, idx) => {
          const cardInner = wrap.querySelector('.card-inner');
          gsap.to(cardInner, {
            rotateY: targetRotY,
            duration: 0.6,
            delay: idx * 0.08,
            ease: "back.out(1.15)",
            onStart: () => playCardSound('flip'),
            onComplete: () => {
              wrap.dataset.flipped = willOpen.toString();
              syncToggleButtonText();
            }
          });
        });
      }

      // Algoritma Pengacakan Benar-benar Acak (True Random Derangement)
      function trulyRandomShuffle(arr) {
        if (arr.length <= 1) return arr;
        const originalKeys = arr.map(c => c.color + (c.id || c.title));
        let result = [...arr];

        let changed = false;
        let attempts = 0;

        while (attempts < 15 && !changed) {
          attempts++;
          for (let i = result.length - 1; i > 0; i--) {
            const randArray = new Uint32Array(1);
            window.crypto.getRandomValues(randArray);
            const j = randArray[0] % (i + 1);
            [result[i], result[j]] = [result[j], result[i]];
          }

          let matchCount = 0;
          for (let k = 0; k < result.length; k++) {
            if (result[k].color + (result[k].id || result[k].title) === originalKeys[k]) {
              matchCount++;
            }
          }
          if (matchCount < result.length) {
            changed = true;
          }
        }

        return result;
      }

      // Buttery Smooth, Seamless 60FPS Physical Card Shuffle via GSAP Timeline
      function shuffle() {
        if (isShuffling) return;
        const wraps = Array.from(cardRow.querySelectorAll('.card-wrap'));
        if (wraps.length <= 1) return;

        isShuffling = true;
        btnShuffle.disabled = true;
        btnFlipToggle.disabled = true;
        statusDot.classList.add('active');
        statusLabel.textContent = 'Mengocok...';

        const rowRect = cardRow.getBoundingClientRect();
        const midX = rowRect.width / 2;
        const midY = rowRect.height / 2;

        const tl = gsap.timeline({
          onComplete: () => {
            isShuffling = false;
            btnShuffle.disabled = false;
            btnFlipToggle.disabled = false;
            statusDot.classList.remove('active');
            statusLabel.textContent = 'Terkocok!';
            setTimeout(() => {
              if (!isShuffling) statusLabel.textContent = 'Siap';
            }, 1400);
          }
        });

        // 1. Smoothly Flip Back Any Opened Card to Face-Down (0.35s)
        wraps.forEach((wrap) => {
          const cardInner = wrap.querySelector('.card-inner');
          if (wrap.dataset.flipped === 'true') {
            tl.to(cardInner, {
              rotateY: 0,
              duration: 0.35,
              ease: "power2.inOut"
            }, 0);
            wrap.dataset.flipped = 'false';
          }
        });
        syncToggleButtonText();

        // 2. Gather All Cards into Center Stack with Thickness Offset (0.45s)
        wraps.forEach((wrap, i) => {
          const rect = wrap.getBoundingClientRect();
          const curX = rect.left - rowRect.left + rect.width / 2;
          const curY = rect.top - rowRect.top + rect.height / 2;
          const dx = midX - curX;
          const dy = midY - curY - (i * 2.5);

          tl.to(wrap, {
            x: dx,
            y: dy,
            rotateX: 0,
            rotateY: 0,
            rotationZ: 0,
            scale: 0.98,
            duration: 0.45,
            ease: "power3.inOut"
          }, 0.25);
        });
        tl.call(() => playCardSound('cut'), null, 0.35);

        // 3. Cut The Deck: Split into Left & Right Packets (0.35s)
        const half = Math.ceil(wraps.length / 2);
        wraps.forEach((wrap, i) => {
          const isLeft = i < half;
          const sideX = isLeft ? -150 : 150;
          const rotZ = isLeft ? -9 : 9;

          tl.to(wrap, {
            x: `+=${sideX}`,
            rotationZ: rotZ,
            duration: 0.35,
            ease: "power2.out"
          }, 0.75);
        });
        tl.call(() => playCardSound('cut'), null, 0.75);

        // 4. Cascading Riffle Interleave (Kocok Silang Bertahap) (0.5s)
        tl.call(() => playCardSound('riffle'), null, 1.15);
        wraps.forEach((wrap, i) => {
          const isLeft = i < half;
          const interleaveOffset = isLeft ? 35 : -35;
          const tilt = isLeft ? 4 : -4;

          tl.to(wrap, {
            x: `-=${isLeft ? -150 : 150}`,
            x: `+=${interleaveOffset}`,
            y: `-=${12}`,
            rotationZ: tilt,
            duration: 0.3,
            ease: "sine.inOut"
          }, 1.15 + (i * 0.05));
        });

        // 5. Square Up Deck in Center with Elastic Tap (0.35s)
        wraps.forEach((wrap, i) => {
          const rect = wrap.getBoundingClientRect();
          const curX = rect.left - rowRect.left + rect.width / 2;
          const curY = rect.top - rowRect.top + rect.height / 2;
          const dx = midX - curX;
          const dy = midY - curY;

          tl.to(wrap, {
            x: dx,
            y: dy,
            rotationZ: 0,
            scale: 1,
            duration: 0.3,
            ease: "power2.inOut"
          }, 1.55);
        });
        tl.call(() => playCardSound('cut'), null, 1.6);

        // 6. Apply Truly Random Data & Deal Out to Original Slots Seamlessly (0.55s)
        tl.call(() => {
          cards = trulyRandomShuffle(cards);
          renderCards();

          // Animate freshly rendered cards dealing out from center to table
          const newWraps = Array.from(cardRow.querySelectorAll('.card-wrap'));
          newWraps.forEach((newWrap, idx) => {
            gsap.fromTo(newWrap,
              {
                opacity: 0,
                y: -30,
                scale: 0.9,
                rotationZ: (Math.random() - 0.5) * 6
              },
              {
                opacity: 1,
                x: 0,
                y: 0,
                scale: 1,
                rotationZ: 0,
                duration: 0.45,
                delay: idx * 0.08,
                ease: "back.out(1.2)",
                onStart: () => playCardSound('cut')
              }
            );
          });
        }, null, 1.9);
      }

      function openModal() {
        jsonInput.value = JSON.stringify(cards, null, 2);
        errorBox.style.display = 'none';
        modalBackdrop.classList.add('is-active');
        setTimeout(() => jsonInput.focus(), 100);
      }

      function closeModal() {
        modalBackdrop.classList.remove('is-active');
      }

      function saveJson() {
        try {
          const val = jsonInput.value.trim();
          const parsed = JSON.parse(val);
          if (!Array.isArray(parsed) || parsed.length === 0) {
            throw new Error('JSON harus berupa array dan berisi minimal 1 kartu.');
          }

          cards = parsed.map((item, idx) => ({
            id: item.id || `card-${idx + 1}`,
            title: item.title || `Kartu ${idx + 1}`,
            content: item.content || '',
            color: item.color || ['#e11d48', '#2563eb', '#059669', '#d97706'][idx % 4]
          }));

          saveData(cards);
          renderCards();
          closeModal();
        } catch (err) {
          errorBox.style.display = 'block';
          errorBox.textContent = 'Format JSON salah: ' + err.message;
        }
      }

      function resetDefault() {
        jsonInput.value = JSON.stringify(DEFAULT_CARDS, null, 2);
        errorBox.style.display = 'none';
      }

      function escapeHtml(str) {
        if (!str) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      // Event Listeners
      btnShuffle.addEventListener('click', shuffle);
      btnFlipToggle.addEventListener('click', toggleAllCards);
      btnOpenJson.addEventListener('click', openModal);
      btnCloseModal.addEventListener('click', closeModal);
      btnResetDefault.addEventListener('click', resetDefault);
      btnSaveJson.addEventListener('click', saveJson);

      modalBackdrop.addEventListener('click', (e) => {
        if (e.target === modalBackdrop) closeModal();
      });

      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && modalBackdrop.classList.contains('is-active')) {
          closeModal();
        } else if (e.key.toLowerCase() === 's' && !modalBackdrop.classList.contains('is-active') && !['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
          e.preventDefault();
          shuffle();
        }
      });

      // Initialize
      loadData();
      renderCards();
    })();
  </script>
</body>
