<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Shuffle | ajra.tech</title>
  <meta name="description" content="Kartu remi warna-warni interaktif dengan animasi mengocok nyata dan kustomisasi JSON.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #ffffff;
      color: #0f172a;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      padding: 40px 20px;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    /* Top minimalist floating controls */
    .controls {
      position: fixed;
      top: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 50;
      background: #ffffff;
      padding: 6px 10px;
      border-radius: 9999px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0, 0, 0, 0.04);
      border: 1px solid #f1f5f9;
    }

    .btn {
      appearance: none;
      border: none;
      background: transparent;
      color: #334155;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 9999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      min-height: 38px;
    }

    .btn:hover:not(:disabled) {
      background: #f8fafc;
      color: #0f172a;
    }

    .btn:focus-visible {
      outline: 2px solid #2563eb;
      outline-offset: 2px;
    }

    .btn-primary {
      background: #0f172a;
      color: #ffffff;
    }

    .btn-primary:hover:not(:disabled) {
      background: #1e293b;
      color: #ffffff;
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* Status indicator */
    .status-badge {
      font-size: 12px;
      font-weight: 600;
      color: #64748b;
      padding: 4px 10px;
      border-radius: 9999px;
      background: #f8fafc;
      border: 1px solid #f1f5f9;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
    }

    .status-dot.active {
      background: #f59e0b;
      animation: blink 0.6s infinite alternate;
    }

    @keyframes blink {
      from { opacity: 0.3; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1.1); }
    }

    /* Main Deck Stage */
    .stage {
      width: 100%;
      max-width: 1300px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      perspective: 2000px;
      margin-top: 50px;
    }

    .card-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 32px;
      width: 100%;
      position: relative;
      min-height: 420px;
    }

    /* Standard Playing Card / Uno Card Proportions: 220px x 330px (~1:1.5 ratio) */
    .card-wrap {
      width: 220px;
      height: 330px;
      perspective: 1400px;
      position: relative;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .card-wrap:hover:not(.is-shuffling) {
      transform: translateY(-10px);
    }

    .card-wrap.is-shuffling {
      pointer-events: none;
      /* Animasi digerakkan via custom keyframe/JS transition */
    }

    .card-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.34, 1.3, 0.64, 1);
      border-radius: 20px;
      box-shadow: 0 12px 30px -6px rgba(0, 0, 0, 0.12), 0 4px 10px -2px rgba(0, 0, 0, 0.06);
    }

    .card-wrap:focus-visible .card-inner {
      box-shadow: 0 0 0 3px #2563eb, 0 12px 30px rgba(0, 0, 0, 0.15);
    }

    .card-wrap.is-flipped .card-inner {
      transform: rotateY(180deg);
    }

    /* Card Faces */
    .card-face {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border-radius: 20px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      overflow: hidden;
    }

    /* SISI DEPAN / TERTUTUP (Polos warna-warni ala Uno dengan inner border putih halus) */
    .card-face-back {
      background-color: var(--card-color, #e11d48);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Garis border dalam khas kartu Uno / kartu remi */
    .card-face-back::before {
      content: '';
      position: absolute;
      inset: 12px;
      border: 3px solid rgba(255, 255, 255, 0.85);
      border-radius: 12px;
      pointer-events: none;
    }

    /* SISI BELAKANG / TERBUKA (Isi konten dari JSON) */
    .card-face-front {
      background-color: #ffffff;
      transform: rotateY(180deg);
      border: 2px solid #f1f5f9;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 20px;
      text-align: left;
    }

    .card-front-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-color-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background-color: var(--card-color, #e11d48);
    }

    .card-index {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 600;
      color: #94a3b8;
    }

    .card-front-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 12px 0;
    }

    .card-title {
      font-size: 18px;
      font-weight: 700;
      color: #0f172a;
      line-height: 1.35;
      margin-bottom: 10px;
      word-break: break-word;
    }

    .card-content {
      font-size: 14px;
      font-weight: 500;
      line-height: 1.6;
      color: #475569;
      word-break: break-word;
      max-height: 160px;
      overflow-y: auto;
    }

    .card-front-footer {
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-top: 1px solid #f1f5f9;
      padding-top: 12px;
      display: flex;
      justify-content: space-between;
    }

    /* Simple JSON Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-backdrop.is-active {
      display: flex;
    }

    .modal-window {
      background: #ffffff;
      width: 100%;
      max-width: 580px;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
      border: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-header {
      padding: 18px 24px;
      border-bottom: 1px solid #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-title {
      font-size: 16px;
      font-weight: 700;
      color: #0f172a;
    }

    .modal-body {
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal-desc {
      font-size: 13px;
      color: #64748b;
      line-height: 1.5;
    }

    .json-textarea {
      width: 100%;
      height: 240px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 12px 14px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: #0f172a;
      background: #f8fafc;
      resize: vertical;
      outline: none;
    }

    .json-textarea:focus {
      border-color: #2563eb;
      background: #ffffff;
    }

    .error-box {
      display: none;
      padding: 10px 14px;
      border-radius: 8px;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
      font-size: 12px;
    }

    .modal-footer {
      padding: 14px 24px;
      border-top: 1px solid #f1f5f9;
      background: #fafafa;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    @media (max-width: 640px) {
      .controls {
        top: 12px;
        flex-wrap: wrap;
        justify-content: center;
      }
      .card-wrap {
        width: 180px;
        height: 270px;
      }
      .card-title {
        font-size: 16px;
      }
      .card-content {
        font-size: 13px;
      }
    }
  </style>
</head>
<body>

  <!-- Floating Controls -->
  <div class="controls">
    <button class="btn btn-primary" id="btnShuffle" type="button">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22"/><path d="m18 2 4 4-4 4"/><path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2"/><path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8"/><path d="m18 14 4 4-4 4"/></svg>
      <span>Kocok Kartu</span>
    </button>
    <button class="btn" id="btnFlipToggle" type="button">Buka Semua</button>
    <button class="btn" id="btnOpenJson" type="button">Edit JSON</button>
    <div class="status-badge">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusLabel">Siap</span>
    </div>
  </div>

  <!-- Stage -->
  <main class="stage">
    <div class="card-row" id="cardRow">
      <!-- Cards rendered here -->
    </div>
  </main>

  <!-- JSON Modal -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal-window">
      <div class="modal-header">
        <h2 class="modal-title">Edit Konten Kartu (JSON)</h2>
        <button class="btn" id="btnCloseModal" type="button" style="padding: 4px 8px; font-size: 18px;">&times;</button>
      </div>
      <div class="modal-body">
        <p class="modal-desc">
          Format array JSON. Tiap item memiliki properti: <code>title</code>, <code>content</code>, dan <code>color</code> (kode HEX warna kartu).
        </p>
        <div class="error-box" id="errorBox"></div>
        <textarea class="json-textarea" id="jsonInput" spellcheck="false"></textarea>
      </div>
      <div class="modal-footer">
        <button class="btn" id="btnResetDefault" type="button">Reset Bawaan</button>
        <button class="btn btn-primary" id="btnSaveJson" type="button">Simpan & Terapkan</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      // 4 kartu Uno default dengan warna solid yang cerah dan tajam
      const DEFAULT_CARDS = [
        {
          id: 'c1',
          title: "Kartu Merah",
          content: "Fokus pada hal paling berdampak. Singkirkan yang tidak perlu.",
          color: "#e11d48"
        },
        {
          id: 'c2',
          title: "Kartu Biru",
          content: "Ketenangan dan kejernihan berpikir menghasilkan keputusan tepat.",
          color: "#2563eb"
        },
        {
          id: 'c3',
          title: "Kartu Hijau",
          content: "Pertumbuhan yang konsisten berawal dari langkah kecil setiap hari.",
          color: "#059669"
        },
        {
          id: 'c4',
          title: "Kartu Kuning",
          content: "Eksplorasi ide baru dengan rasa ingin tahu tanpa batas.",
          color: "#d97706"
        }
      ];

      const STORAGE_KEY = 'ajra_cards_data_v2';
      let cards = [];
      let isShuffling = false;

      const cardRow = document.getElementById('cardRow');
      const btnShuffle = document.getElementById('btnShuffle');
      const btnFlipToggle = document.getElementById('btnFlipToggle');
      const btnOpenJson = document.getElementById('btnOpenJson');
      const modalBackdrop = document.getElementById('modalBackdrop');
      const btnCloseModal = document.getElementById('btnCloseModal');
      const btnResetDefault = document.getElementById('btnResetDefault');
      const btnSaveJson = document.getElementById('btnSaveJson');
      const jsonInput = document.getElementById('jsonInput');
      const errorBox = document.getElementById('errorBox');
      const statusDot = document.getElementById('statusDot');
      const statusLabel = document.getElementById('statusLabel');

      // Web Audio API sintetis untuk efek gesekan kartu realistis
      let audioCtx = null;
      function playCardSound(type) {
        try {
          if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          }
          if (audioCtx.state === 'suspended') {
            audioCtx.resume();
          }

          const now = audioCtx.currentTime;

          if (type === 'flip') {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(380, now);
            osc.frequency.exponentialRampToValueAtTime(680, now + 0.07);
            gain.gain.setValueAtTime(0.08, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
            osc.start(now);
            osc.stop(now + 0.08);
          } else if (type === 'cut') {
            // Suara gesekan tumpukan kartu terpotong
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(220, now);
            osc.frequency.exponentialRampToValueAtTime(320, now + 0.09);
            gain.gain.setValueAtTime(0.06, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
            osc.start(now);
            osc.stop(now + 0.1);
          } else if (type === 'riffle') {
            // Suara daun kartu berderak (riffle shuffle flutter)
            for (let i = 0; i < 6; i++) {
              const tickTime = now + (i * 0.035);
              const osc = audioCtx.createOscillator();
              const gain = audioCtx.createGain();
              osc.connect(gain);
              gain.connect(audioCtx.destination);
              osc.type = 'sine';
              osc.frequency.setValueAtTime(500 + (Math.random() * 250), tickTime);
              gain.gain.setValueAtTime(0.04, tickTime);
              gain.gain.exponentialRampToValueAtTime(0.001, tickTime + 0.025);
              osc.start(tickTime);
              osc.stop(tickTime + 0.025);
            }
          }
        } catch (e) {
          // Audio opsional
        }
      }

      function loadData() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed) && parsed.length > 0) {
              cards = parsed;
              return;
            }
          }
        } catch (e) {
          console.warn('Gagal membaca storage, menggunakan default.');
        }
        cards = JSON.parse(JSON.stringify(DEFAULT_CARDS));
      }

      function saveData(data) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      }

      function renderCards() {
        cardRow.innerHTML = '';

        cards.forEach((item, index) => {
          const cardWrap = document.createElement('div');
          cardWrap.className = 'card-wrap';
          cardWrap.id = `card-${index}`;
          cardWrap.tabIndex = 0;
          cardWrap.style.setProperty('--card-color', item.color || '#e11d48');
          cardWrap.setAttribute('role', 'button');
          cardWrap.setAttribute('aria-label', `Kartu nomor ${index + 1}: ${item.title}`);

          const num = String(index + 1).padStart(2, '0');

          cardWrap.innerHTML = `
            <div class="card-inner">
              <!-- Depan: Polos solid warna Uno -->
              <div class="card-face card-face-back"></div>

              <!-- Belakang: Isi teks -->
              <div class="card-face card-face-front">
                <div class="card-front-top">
                  <div class="card-color-dot"></div>
                  <span class="card-index">#${num}</span>
                </div>
                <div class="card-front-body">
                  <h3 class="card-title">${escapeHtml(item.title || '')}</h3>
                  <p class="card-content">${escapeHtml(item.content || '')}</p>
                </div>
                <div class="card-front-footer">
                  <span>ajra.tech</span>
                  <span>Flip</span>
                </div>
              </div>
            </div>
          `;

          // Flip on click
          cardWrap.addEventListener('click', () => {
            if (isShuffling) return;
            cardWrap.classList.toggle('is-flipped');
            playCardSound('flip');
            syncToggleButtonText();
          });

          // Flip on keyboard Enter/Space
          cardWrap.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              if (isShuffling) return;
              cardWrap.classList.toggle('is-flipped');
              playCardSound('flip');
              syncToggleButtonText();
            }
          });

          cardRow.appendChild(cardWrap);
        });

        syncToggleButtonText();
      }

      function syncToggleButtonText() {
        const wraps = Array.from(cardRow.querySelectorAll('.card-wrap'));
        if (wraps.length === 0) return;
        const flipped = cardRow.querySelectorAll('.card-wrap.is-flipped').length;
        btnFlipToggle.textContent = (flipped === wraps.length) ? 'Tutup Semua' : 'Buka Semua';
      }

      function toggleAllCards() {
        if (isShuffling) return;
        const wraps = Array.from(cardRow.querySelectorAll('.card-wrap'));
        if (wraps.length === 0) return;

        const flipped = cardRow.querySelectorAll('.card-wrap.is-flipped').length;
        const willOpen = (flipped < wraps.length);

        wraps.forEach((card, idx) => {
          setTimeout(() => {
            if (willOpen) {
              card.classList.add('is-flipped');
            } else {
              card.classList.remove('is-flipped');
            }
            playCardSound('flip');
            syncToggleButtonText();
          }, idx * 70);
        });
      }

      // Algoritma Pengacakan Benar-benar Acak (True Random Derangement / Fisher-Yates Berbobot)
      function trulyRandomShuffle(arr) {
        if (arr.length <= 1) return arr;
        const originalColors = arr.map(c => c.color + (c.id || c.title));
        let result = [...arr];

        // Lakukan pengacakan sampai posisi berubah nyata
        let attempts = 0;
        let changed = false;

        while (attempts < 10 && !changed) {
          attempts++;
          for (let i = result.length - 1; i > 0; i--) {
            // Crypto random untuk true entropy
            const randArray = new Uint32Array(1);
            window.crypto.getRandomValues(randArray);
            const j = randArray[0] % (i + 1);
            [result[i], result[j]] = [result[j], result[i]];
          }

          // Cek apakah minimal 2 elemen berpindah posisi
          let matchCount = 0;
          for (let k = 0; k < result.length; k++) {
            if (result[k].color + (result[k].id || result[k].title) === originalColors[k]) {
              matchCount++;
            }
          }
          if (matchCount < result.length) {
            changed = true;
          }
        }

        return result;
      }

      // Animasi Mengocok Kartu Nyata (Full Multi-Stage Physical Shuffling)
      function shuffle() {
        if (isShuffling) return;
        const wraps = Array.from(cardRow.querySelectorAll('.card-wrap'));
        if (wraps.length <= 1) return;

        isShuffling = true;
        btnShuffle.disabled = true;
        btnFlipToggle.disabled = true;
        statusDot.classList.add('active');
        statusLabel.textContent = 'Mengocok...';

        // 1. Tutup semua kartu yang sedang terbuka
        wraps.forEach(w => {
          w.classList.remove('is-flipped');
          w.classList.add('is-shuffling');
        });
        syncToggleButtonText();

        const rowRect = cardRow.getBoundingClientRect();
        const midX = rowRect.width / 2;
        const midY = rowRect.height / 2;

        // FASE 1: Semua kartu bergerak menyatu ke tengah menjadi tumpukan rapi (0ms - 400ms)
        wraps.forEach((wrap, i) => {
          const rect = wrap.getBoundingClientRect();
          const curX = rect.left - rowRect.left + rect.width / 2;
          const curY = rect.top - rowRect.top + rect.height / 2;
          const dx = midX - curX;
          const dy = midY - curY - (i * 2); // sedikit offset vertikal agar terasa tebal bertumpuk

          wrap.style.transition = 'transform 0.4s cubic-bezier(0.2, 0.9, 0.3, 1)';
          wrap.style.transform = `translate3d(${dx}px, ${dy}px, 0px) rotate(0deg) scale(0.96)`;
          wrap.style.zIndex = `${10 + i}`;
        });
        playCardSound('cut');

        // FASE 2: Potong tumpukan menjadi dua (kiri dan kanan) (450ms)
        setTimeout(() => {
          const half = Math.ceil(wraps.length / 2);
          wraps.forEach((wrap, i) => {
            const rect = wrap.getBoundingClientRect();
            const curX = rect.left - rowRect.left + rect.width / 2;
            const curY = rect.top - rowRect.top + rect.height / 2;
            const isLeft = i < half;
            const sideOffset = isLeft ? -130 : 130;
            const sideAngle = isLeft ? -9 : 9;
            const dx = (midX - curX) + sideOffset;
            const dy = (midY - curY);

            wrap.style.transition = 'transform 0.35s cubic-bezier(0.34, 1.25, 0.64, 1)';
            wrap.style.transform = `translate3d(${dx}px, ${dy}px, 0px) rotate(${sideAngle}deg) scale(0.96)`;
          });
          playCardSound('cut');
        }, 450);

        // FASE 3: Riffle Interleave (Kocok kartu silang berderak) (850ms)
        setTimeout(() => {
          playCardSound('riffle');
          wraps.forEach((wrap, i) => {
            const rect = wrap.getBoundingClientRect();
            const curX = rect.left - rowRect.left + rect.width / 2;
            const curY = rect.top - rowRect.top + rect.height / 2;
            // Geser silang bolak-balik
            const interleaveX = (i % 2 === 0 ? 30 : -30);
            const interleaveRot = (i % 2 === 0 ? 5 : -5);
            const dx = (midX - curX) + interleaveX;
            const dy = (midY - curY);

            wrap.style.transition = 'transform 0.28s ease-in-out';
            wrap.style.transform = `translate3d(${dx}px, ${dy}px, 0px) rotate(${interleaveRot}deg) scale(1)`;
          });
        }, 850);

        // FASE 4: Kocokan kedua & rapikan ke tengah (Square Up) (1200ms)
        setTimeout(() => {
          playCardSound('cut');
          wraps.forEach((wrap, i) => {
            const rect = wrap.getBoundingClientRect();
            const curX = rect.left - rowRect.left + rect.width / 2;
            const curY = rect.top - rowRect.top + rect.height / 2;
            const dx = midX - curX;
            const dy = midY - curY;

            wrap.style.transition = 'transform 0.3s cubic-bezier(0.25, 1, 0.5, 1)';
            wrap.style.transform = `translate3d(${dx}px, ${dy}px, 0px) rotate(0deg) scale(0.98)`;
          });
        }, 1200);

        // FASE 5: Terapkan urutan acak sejati & Deal Out ke posisi masing-masing (1550ms)
        setTimeout(() => {
          cards = trulyRandomShuffle(cards);
          renderCards();

          // Deal out animasi bertahap (stagger) meluncur ke meja
          const newWraps = Array.from(cardRow.querySelectorAll('.card-wrap'));
          newWraps.forEach((wrap, idx) => {
            wrap.style.opacity = '0';
            wrap.style.transform = 'scale(0.85) translateY(-30px)';
            setTimeout(() => {
              wrap.style.transition = 'all 0.35s cubic-bezier(0.16, 1, 0.3, 1)';
              wrap.style.opacity = '1';
              wrap.style.transform = 'none';
              playCardSound('cut');
            }, idx * 75);
          });

          // Selesai pengocokan
          setTimeout(() => {
            isShuffling = false;
            btnShuffle.disabled = false;
            btnFlipToggle.disabled = false;
            statusDot.classList.remove('active');
            statusLabel.textContent = 'Terkocok!';
            setTimeout(() => {
              if (!isShuffling) statusLabel.textContent = 'Siap';
            }, 1500);
          }, (newWraps.length * 75) + 200);

        }, 1550);
      }

      function openModal() {
        jsonInput.value = JSON.stringify(cards, null, 2);
        errorBox.style.display = 'none';
        modalBackdrop.classList.add('is-active');
        setTimeout(() => jsonInput.focus(), 100);
      }

      function closeModal() {
        modalBackdrop.classList.remove('is-active');
      }

      function saveJson() {
        try {
          const val = jsonInput.value.trim();
          const parsed = JSON.parse(val);
          if (!Array.isArray(parsed) || parsed.length === 0) {
            throw new Error('JSON harus berupa array dan berisi minimal 1 kartu.');
          }

          cards = parsed.map((item, idx) => ({
            id: item.id || `custom-${idx + 1}`,
            title: item.title || `Kartu ${idx + 1}`,
            content: item.content || '',
            color: item.color || ['#e11d48', '#2563eb', '#059669', '#d97706'][idx % 4]
          }));

          saveData(cards);
          renderCards();
          closeModal();
        } catch (err) {
          errorBox.style.display = 'block';
          errorBox.textContent = 'Format JSON salah: ' + err.message;
        }
      }

      function resetDefault() {
        jsonInput.value = JSON.stringify(DEFAULT_CARDS, null, 2);
        errorBox.style.display = 'none';
      }

      function escapeHtml(str) {
        if (!str) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      // Listeners
      btnShuffle.addEventListener('click', shuffle);
      btnFlipToggle.addEventListener('click', toggleAllCards);
      btnOpenJson.addEventListener('click', openModal);
      btnCloseModal.addEventListener('click', closeModal);
      btnResetDefault.addEventListener('click', resetDefault);
      btnSaveJson.addEventListener('click', saveJson);

      modalBackdrop.addEventListener('click', (e) => {
        if (e.target === modalBackdrop) closeModal();
      });

      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && modalBackdrop.classList.contains('is-active')) {
          closeModal();
        } else if (e.key.toLowerCase() === 's' && !modalBackdrop.classList.contains('is-active') && !['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
          e.preventDefault();
          shuffle();
        }
      });

      // Init
      loadData();
      renderCards();
    })();
  </script>
</body>
</html>
