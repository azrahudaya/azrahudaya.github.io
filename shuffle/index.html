<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Shuffle | ajra.tech</title>
  <meta name="description" content="Kartu remi warna-warni interaktif dengan animasi shuffle dan kustomisasi JSON.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #ffffff;
      color: #0f172a;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      padding: 32px 20px;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    /* Top minimalist floating controls */
    .controls {
      position: fixed;
      top: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 50;
      background: #ffffff;
      padding: 6px 8px;
      border-radius: 9999px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06), 0 1px 3px rgba(0, 0, 0, 0.04);
      border: 1px solid #f1f5f9;
    }

    .btn {
      appearance: none;
      border: none;
      background: transparent;
      color: #334155;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 9999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      min-height: 36px;
    }

    .btn:hover:not(:disabled) {
      background: #f8fafc;
      color: #0f172a;
    }

    .btn:focus-visible {
      outline: 2px solid #2563eb;
      outline-offset: 2px;
    }

    .btn-primary {
      background: #0f172a;
      color: #ffffff;
    }

    .btn-primary:hover:not(:disabled) {
      background: #1e293b;
      color: #ffffff;
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Main Deck Stage */
    .stage {
      width: 100%;
      max-width: 1300px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      perspective: 1600px;
      margin-top: 40px;
    }

    .card-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 28px;
      width: 100%;
      position: relative;
      min-height: 400px;
    }

    /* Standard Playing Card / Uno Card Proportions: 220px x 330px (~1:1.5 ratio) */
    .card-wrap {
      width: 220px;
      height: 330px;
      perspective: 1200px;
      position: relative;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .card-wrap:hover:not(.is-shuffling) {
      transform: translateY(-10px);
    }

    .card-wrap.is-shuffling {
      pointer-events: none;
      transition: transform 0.45s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .card-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.34, 1.3, 0.64, 1);
      border-radius: 20px;
      box-shadow: 0 12px 30px -6px rgba(0, 0, 0, 0.12), 0 4px 10px -2px rgba(0, 0, 0, 0.06);
    }

    .card-wrap:focus-visible .card-inner {
      box-shadow: 0 0 0 3px #2563eb, 0 12px 30px rgba(0, 0, 0, 0.15);
    }

    .card-wrap.is-flipped .card-inner {
      transform: rotateY(180deg);
    }

    /* Card Faces */
    .card-face {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border-radius: 20px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      overflow: hidden;
    }

    /* SISI DEPAN / TERTUTUP (Polos warna-warni ala Uno dengan inner border putih halus) */
    .card-face-back {
      background-color: var(--card-color, #e11d48);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Garis border dalam khas kartu Uno / kartu remi */
    .card-face-back::before {
      content: '';
      position: absolute;
      inset: 12px;
      border: 3px solid rgba(255, 255, 255, 0.85);
      border-radius: 12px;
      pointer-events: none;
    }

    /* SISI BELAKANG / TERBUKA (Isi konten dari JSON) */
    .card-face-front {
      background-color: #ffffff;
      transform: rotateY(180deg);
      border: 2px solid #f1f5f9;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 20px;
      text-align: left;
    }

    .card-front-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-color-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: var(--card-color, #e11d48);
    }

    .card-index {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 600;
      color: #94a3b8;
    }

    .card-front-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 12px 0;
    }

    .card-title {
      font-size: 18px;
      font-weight: 700;
      color: #0f172a;
      line-height: 1.35;
      margin-bottom: 10px;
      word-break: break-word;
    }

    .card-content {
      font-size: 14px;
      font-weight: 500;
      line-height: 1.6;
      color: #475569;
      word-break: break-word;
      max-height: 160px;
      overflow-y: auto;
    }

    .card-front-footer {
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-top: 1px solid #f1f5f9;
      padding-top: 12px;
      display: flex;
      justify-content: space-between;
    }

    /* Simple JSON Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-backdrop.is-active {
      display: flex;
    }

    .modal-window {
      background: #ffffff;
      width: 100%;
      max-width: 580px;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
      border: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-header {
      padding: 18px 24px;
      border-bottom: 1px solid #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-title {
      font-size: 16px;
      font-weight: 700;
      color: #0f172a;
    }

    .modal-body {
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal-desc {
      font-size: 13px;
      color: #64748b;
      line-height: 1.5;
    }

    .json-textarea {
      width: 100%;
      height: 240px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 12px 14px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: #0f172a;
      background: #f8fafc;
      resize: vertical;
      outline: none;
    }

    .json-textarea:focus {
      border-color: #2563eb;
      background: #ffffff;
    }

    .error-box {
      display: none;
      padding: 10px 14px;
      border-radius: 8px;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
      font-size: 12px;
    }

    .modal-footer {
      padding: 14px 24px;
      border-top: 1px solid #f1f5f9;
      background: #fafafa;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    @media (max-width: 640px) {
      .controls {
        top: 12px;
      }
      .card-wrap {
        width: 180px;
        height: 270px;
      }
      .card-title {
        font-size: 16px;
      }
      .card-content {
        font-size: 13px;
      }
    }
  </style>
</head>
<body>

  <!-- Floating Controls -->
  <div class="controls">
    <button class="btn btn-primary" id="btnShuffle" type="button">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22"/><path d="m18 2 4 4-4 4"/><path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2"/><path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8"/><path d="m18 14 4 4-4 4"/></svg>
      <span>Shuffle</span>
    </button>
    <button class="btn" id="btnFlipToggle" type="button">Buka Semua</button>
    <button class="btn" id="btnOpenJson" type="button">Edit JSON</button>
  </div>

  <!-- Stage -->
  <main class="stage">
    <div class="card-row" id="cardRow">
      <!-- Cards rendered here -->
    </div>
  </main>

  <!-- JSON Modal -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal-window">
      <div class="modal-header">
        <h2 class="modal-title">Edit Konten Kartu (JSON)</h2>
        <button class="btn" id="btnCloseModal" type="button" style="padding: 4px 8px; font-size: 18px;">&times;</button>
      </div>
      <div class="modal-body">
        <p class="modal-desc">
          Format array JSON. Tiap item memiliki properti: <code>title</code>, <code>content</code>, dan <code>color</code> (kode HEX).
        </p>
        <div class="error-box" id="errorBox"></div>
        <textarea class="json-textarea" id="jsonInput" spellcheck="false"></textarea>
      </div>
      <div class="modal-footer">
        <button class="btn" id="btnResetDefault" type="button">Reset Bawaan</button>
        <button class="btn btn-primary" id="btnSaveJson" type="button">Simpan & Terapkan</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      // 4 kartu Uno default dengan warna solid yang cerah dan tajam
      const DEFAULT_CARDS = [
        {
          title: "Kartu Merah",
          content: "Fokus pada hal paling berdampak. Singkirkan yang tidak perlu.",
          color: "#e11d48"
        },
        {
          title: "Kartu Biru",
          content: "Ketenangan dan kejernihan berpikir menghasilkan keputusan tepat.",
          color: "#2563eb"
        },
        {
          title: "Kartu Hijau",
          content: "Pertumbuhan yang konsisten berawal dari langkah kecil setiap hari.",
          color: "#059669"
        },
        {
          title: "Kartu Kuning",
          content: "Eksplorasi ide baru dengan rasa ingin tahu tanpa batas.",
          color: "#d97706"
        }
      ];

      const STORAGE_KEY = 'ajra_cards_data_v2';
      let cards = [];
      let isShuffling = false;

      const cardRow = document.getElementById('cardRow');
      const btnShuffle = document.getElementById('btnShuffle');
      const btnFlipToggle = document.getElementById('btnFlipToggle');
      const btnOpenJson = document.getElementById('btnOpenJson');
      const modalBackdrop = document.getElementById('modalBackdrop');
      const btnCloseModal = document.getElementById('btnCloseModal');
      const btnResetDefault = document.getElementById('btnResetDefault');
      const btnSaveJson = document.getElementById('btnSaveJson');
      const jsonInput = document.getElementById('jsonInput');
      const errorBox = document.getElementById('errorBox');

      function loadData() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed) && parsed.length > 0) {
              cards = parsed;
              return;
            }
          }
        } catch (e) {
          console.warn('Gagal membaca storage, menggunakan default.');
        }
        cards = JSON.parse(JSON.stringify(DEFAULT_CARDS));
      }

      function saveData(data) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      }

      function renderCards() {
        cardRow.innerHTML = '';

        cards.forEach((item, index) => {
          const cardWrap = document.createElement('div');
          cardWrap.className = 'card-wrap';
          cardWrap.tabIndex = 0;
          cardWrap.style.setProperty('--card-color', item.color || '#e11d48');
          cardWrap.setAttribute('role', 'button');
          cardWrap.setAttribute('aria-label', `Kartu nomor ${index + 1}: ${item.title}`);

          const num = String(index + 1).padStart(2, '0');

          cardWrap.innerHTML = `
            <div class="card-inner">
              <!-- Depan: Polos solid warna Uno -->
              <div class="card-face card-face-back"></div>

              <!-- Belakang: Isi teks -->
              <div class="card-face card-face-front">
                <div class="card-front-top">
                  <div class="card-color-dot"></div>
                  <span class="card-index">#${num}</span>
                </div>
                <div class="card-front-body">
                  <h3 class="card-title">${escapeHtml(item.title || '')}</h3>
                  <p class="card-content">${escapeHtml(item.content || '')}</p>
                </div>
                <div class="card-front-footer">
                  <span>ajra.tech</span>
                  <span>Flip</span>
                </div>
              </div>
            </div>
          `;

          // Flip on click
          cardWrap.addEventListener('click', () => {
            if (isShuffling) return;
            cardWrap.classList.toggle('is-flipped');
            syncToggleButtonText();
          });

          // Flip on keyboard Enter/Space
          cardWrap.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              if (isShuffling) return;
              cardWrap.classList.toggle('is-flipped');
              syncToggleButtonText();
            }
          });

          cardRow.appendChild(cardWrap);
        });

        syncToggleButtonText();
      }

      function syncToggleButtonText() {
        const wraps = Array.from(cardRow.querySelectorAll('.card-wrap'));
        if (wraps.length === 0) return;
        const flipped = cardRow.querySelectorAll('.card-wrap.is-flipped').length;
        btnFlipToggle.textContent = (flipped === wraps.length) ? 'Tutup Semua' : 'Buka Semua';
      }

      function toggleAllCards() {
        if (isShuffling) return;
        const wraps = Array.from(cardRow.querySelectorAll('.card-wrap'));
        if (wraps.length === 0) return;

        const flipped = cardRow.querySelectorAll('.card-wrap.is-flipped').length;
        const willOpen = (flipped < wraps.length);

        wraps.forEach((card, idx) => {
          setTimeout(() => {
            if (willOpen) {
              card.classList.add('is-flipped');
            } else {
              card.classList.remove('is-flipped');
            }
            syncToggleButtonText();
          }, idx * 70);
        });
      }

      function shuffle() {
        if (isShuffling) return;
        const wraps = Array.from(cardRow.querySelectorAll('.card-wrap'));
        if (wraps.length <= 1) return;

        isShuffling = true;
        btnShuffle.disabled = true;
        btnFlipToggle.disabled = true;

        // Tutup kartu terlebih dahulu
        wraps.forEach(w => {
          w.classList.remove('is-flipped');
          w.classList.add('is-shuffling');
        });
        syncToggleButtonText();

        // Kumpulkan ke tengah layar (stacking deck)
        const rowRect = cardRow.getBoundingClientRect();
        const midX = rowRect.width / 2;
        const midY = rowRect.height / 2;

        wraps.forEach((wrap, i) => {
          const rect = wrap.getBoundingClientRect();
          const curX = rect.left - rowRect.left + rect.width / 2;
          const curY = rect.top - rowRect.top + rect.height / 2;
          const dx = midX - curX;
          const dy = midY - curY;
          const rot = (Math.random() - 0.5) * 16;

          wrap.style.transform = `translate3d(${dx}px, ${dy}px, 0px) rotate(${rot}deg) scale(0.96)`;
          wrap.style.zIndex = `${10 + i}`;
        });

        // Efek kocok kartu (riffle jitter)
        setTimeout(() => {
          wraps.forEach((wrap) => {
            const rowRectNow = cardRow.getBoundingClientRect();
            const rect = wrap.getBoundingClientRect();
            const curX = rect.left - rowRectNow.left + rect.width / 2;
            const curY = rect.top - rowRectNow.top + rect.height / 2;
            const jx = (Math.random() - 0.5) * 50;
            const jy = (Math.random() - 0.5) * 30;
            const dx = (rowRectNow.width / 2) - curX + jx;
            const dy = (rowRectNow.height / 2) - curY + jy;
            const rot = (Math.random() - 0.5) * 28;

            wrap.style.transform = `translate3d(${dx}px, ${dy}px, 0px) rotate(${rot}deg) scale(1)`;
          });
        }, 320);

        // Acak array dan sebar kembali
        setTimeout(() => {
          for (let i = cards.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [cards[i], cards[j]] = [cards[j], cards[i]];
          }

          renderCards();

          // Deal out animasi halus
          const newWraps = Array.from(cardRow.querySelectorAll('.card-wrap'));
          newWraps.forEach((wrap, idx) => {
            wrap.style.opacity = '0';
            wrap.style.transform = 'scale(0.85) translateY(20px)';
            setTimeout(() => {
              wrap.style.transition = 'all 0.35s cubic-bezier(0.16, 1, 0.3, 1)';
              wrap.style.opacity = '1';
              wrap.style.transform = 'none';
            }, idx * 60);
          });

          setTimeout(() => {
            isShuffling = false;
            btnShuffle.disabled = false;
            btnFlipToggle.disabled = false;
          }, newWraps.length * 60 + 150);

        }, 700);
      }

      function openModal() {
        jsonInput.value = JSON.stringify(cards, null, 2);
        errorBox.style.display = 'none';
        modalBackdrop.classList.add('is-active');
        setTimeout(() => jsonInput.focus(), 100);
      }

      function closeModal() {
        modalBackdrop.classList.remove('is-active');
      }

      function saveJson() {
        try {
          const val = jsonInput.value.trim();
          const parsed = JSON.parse(val);
          if (!Array.isArray(parsed) || parsed.length === 0) {
            throw new Error('JSON harus berupa array dan berisi minimal 1 kartu.');
          }

          cards = parsed.map((item, idx) => ({
            title: item.title || `Kartu ${idx + 1}`,
            content: item.content || '',
            color: item.color || ['#e11d48', '#2563eb', '#059669', '#d97706'][idx % 4]
          }));

          saveData(cards);
          renderCards();
          closeModal();
        } catch (err) {
          errorBox.style.display = 'block';
          errorBox.textContent = 'Format JSON salah: ' + err.message;
        }
      }

      function resetDefault() {
        jsonInput.value = JSON.stringify(DEFAULT_CARDS, null, 2);
        errorBox.style.display = 'none';
      }

      function escapeHtml(str) {
        if (!str) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      // Listeners
      btnShuffle.addEventListener('click', shuffle);
      btnFlipToggle.addEventListener('click', toggleAllCards);
      btnOpenJson.addEventListener('click', openModal);
      btnCloseModal.addEventListener('click', closeModal);
      btnResetDefault.addEventListener('click', resetDefault);
      btnSaveJson.addEventListener('click', saveJson);

      modalBackdrop.addEventListener('click', (e) => {
        if (e.target === modalBackdrop) closeModal();
      });

      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && modalBackdrop.classList.contains('is-active')) {
          closeModal();
        }
      });

      // Init
      loadData();
      renderCards();
    })();
  </script>
</body>
</html>
